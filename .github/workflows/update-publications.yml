name: Update publications

on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC — edit if you want a different cadence
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest publications from ORCID
        env:
          ORCID_ID: "0009-0001-5002-3812"
        run: node scripts/fetch-orcid.mjs

      - name: Commit changes if anything updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add publications.json
          git diff --staged --quiet || git commit -m "Update publications from ORCID"
          git push
